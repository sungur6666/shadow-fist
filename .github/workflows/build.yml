name: Shadow Fist - Derle ve Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Gradle derleme
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-fist-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
      - name: APK adını düzenle
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ShadowFist-v3.52.apk
      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shadow Fist v1.1 (derleme ${{ github.run_number }})
          files: ShadowFist-v3.52.apk
          make_latest: true
